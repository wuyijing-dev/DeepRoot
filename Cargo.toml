[workspace]
resolver = "2"
members = [
    "kernel",
    "libs/deeproot-abi",
    "libs/deeproot-user",
    "user/init",
    "user/console",
    "user/ping",
    "user/hello",
    "user/shell",
    "user/badapple",
    "user/moddemo",
    "user/modnote",
    "user/grantpeer",
    "user/virtioblk",
]
default-members = ["kernel"]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wuyijing-dev/DeepRoot"
authors = ["wuyijing-dev"]

[workspace.dependencies]
deeproot-abi = { path = "libs/deeproot-abi" }
deeproot-user = { path = "libs/deeproot-user" }
