# CI — release build + QEMU smoke (DeepRoot 0.7+)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust RISC-V target
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc

      - name: Build + QEMU smoke
        run: ./scripts/run-qemu.sh --smoke
